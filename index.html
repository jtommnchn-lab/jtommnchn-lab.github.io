<style>
:root{
  --bg-0:#060c1a;
  --bg-1:#0a1628;
  --bg-2:#0f1f38;
  --surface:rgba(255,255,255,.055);
  --surface-strong:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --text:#f7f8fb;
  --text-dim:rgba(255,255,255,.62);
  --text-faint:rgba(255,255,255,.38);
  --accent:#ff9800;
  --accent-2:#f57c00;
  --green:#22c55e;
  --green-2:#16a34a;
  --purple:#a855f7;
  --purple-2:#7c3aed;
  --red:#ef4444;

  --radius-lg:30px;
  --shadow-lg:0 30px 80px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg-1);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}

/* Ambient background blobs */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;
  filter:blur(120px);opacity:.18;pointer-events:none;z-index:0;
}
body::before{
  width:520px;height:520px;
  background:radial-gradient(circle,#ff9800,transparent 70%);
  top:-160px;right:-120px;
}
body::after{
  width:600px;height:600px;
  background:radial-gradient(circle,#7c3aed,transparent 70%);
  bottom:-200px;left:-160px;
}
body > *{position:relative;z-index:1}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}

/* ----- LEAD PROMPT ----- */
.lead-prompt{
  position:fixed;bottom:120px;left:50%;
  transform:translateX(-50%) translateY(24px) scale(.95);
  background:linear-gradient(135deg,#25D366,#128c45);
  color:#fff;padding:14px 26px;border-radius:60px;
  font-size:14px;font-weight:600;
  box-shadow:0 16px 44px rgba(37,211,102,.42),0 0 0 1px rgba(255,255,255,.15) inset;
  z-index:10000;opacity:0;pointer-events:none;
  transition:.45s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;letter-spacing:.2px;
  backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:8px;
}
.lead-prompt.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.lead-prompt::before{content:'✨';font-size:16px}

/* ----- TOP BAR ----- */
.topbar{
  position:sticky;top:0;z-index:1000;
  background:rgba(10,22,40,.72);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 20px;
  border-bottom:1px solid var(--border);
}
.topbar img{height:34px;object-fit:contain}
.actions{display:flex;gap:10px;align-items:center}
.actions a{
  text-decoration:none;font-size:18px;color:var(--text);
  transition:all .25s;padding:9px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;
}
.actions a:hover{
  transform:translateY(-2px);
  background:var(--surface-strong);
  border-color:var(--border-strong);
}

/* ----- HERO ----- */
.hero{
  width:100%;height:clamp(180px,32vh,340px);
  position:relative;overflow:hidden;
}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,var(--bg-1) 100%);
  pointer-events:none;
}
@media(max-width:768px){.hero{height:160px}}
@media(max-width:480px){.hero{height:130px}}

/* ----- DURATION ----- */
.duration-wrapper{padding:18px 16px 4px;max-width:1300px;margin:0 auto}

  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  backdrop-filter:blur(24px);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:36px 28px 40px;
  text-align:center;
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.04) inset;
  position:relative;overflow:hidden;
}
.form::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,152,0,.6),transparent);
}
.form .form-icon{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  width:56px;height:56px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;margin:0 auto 18px;
  box-shadow:0 8px 24px rgba(255,152,0,.35);
}
.form h3{color:var(--text);font-size:1.25rem;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.form .form-subtitle{color:var(--text-dim);font-size:.83rem;margin-bottom:24px}
.input-group{position:relative;text-align:left;margin:6px 0 2px}
.input-group label{
  position:absolute;top:-8px;left:20px;
  background:linear-gradient(180deg,transparent,rgba(10,22,40,.6));
  padding:0 8px;font-size:.7rem;font-weight:600;
  color:var(--text-faint);letter-spacing:.5px;text-transform:uppercase;
  pointer-events:none;transition:all .3s;opacity:0;transform:translateY(4px);
}
.input-group.focused label,
.input-group.has-value label{
  opacity:1;transform:translateY(0);
  background:var(--bg-1);border-radius:6px;
}
input{
  width:100%;padding:16px 20px;border-radius:16px;
  border:1.5px solid var(--border);font-size:15px;
  background:rgba(255,255,255,.05);color:var(--text);
  transition:all .3s;outline:none;font-family:inherit;font-weight:500;
}
input::placeholder{color:var(--text-faint);font-weight:400}
input:focus{
  border-color:var(--accent);background:rgba(255,152,0,.05);
  box-shadow:0 0 0 4px rgba(255,152,0,.1);
}
input.error{border-color:var(--red);background:rgba(239,68,68,.08)}
.error-text{
  color:var(--red);font-size:12px;text-align:left;
  padding-left:20px;min-height:18px;font-weight:500;margin-top:4px;
}
.form .btn-submit{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#0a1628;border:none;padding:17px;border-radius:16px;
  font-weight:800;font-size:1rem;cursor:pointer;width:100%;
  margin-top:20px;transition:all .3s;
  box-shadow:0 8px 28px rgba(255,152,0,.28);
  letter-spacing:.2px;font-family:inherit;
}
.form .btn-submit:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(255,152,0,.4)}
.form .btn-submit:active{transform:translateY(-1px) scale(.98)}

/* ----- BOTTOM BAR ----- */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,22,40,.9);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  padding:14px 20px 18px;
  display:none;flex-direction:column;gap:10px;
  box-shadow:0 -10px 50px rgba(0,0,0,.55);
  z-index:1000;border-radius:26px 26px 0 0;
  border-top:1px solid var(--border);
}
.bottom-bar .price-line{
  font-size:26px;font-weight:900;text-align:center;
  color:var(--accent);letter-spacing:-.5px;
}
.bottom-bar .price-line small{font-size:14px;font-weight:500;color:var(--text-faint)}
.bottom-bar button{
  background:linear-gradient(135deg,#25D366,#128c45);
  width:100%;margin:0;font-size:16px;font-weight:800;
  padding:15px;border:none;border-radius:16px;color:#fff;
  cursor:pointer;transition:all .3s;
  box-shadow:0 8px 28px rgba(37,211,102,.3);
  font-family:inherit;letter-spacing:.2px;
}
.bottom-bar button:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(37,211,102,.45);
}
.bottom-bar button:disabled{
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.2);
  box-shadow:none;cursor:not-allowed;
}
.bottom-bar button:active:not(:disabled){transform:scale(.97)}
